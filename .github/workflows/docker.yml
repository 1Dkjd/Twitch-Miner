# 1Dkjd/Twitch-Miner: every push to main publishes ghcr.io/1dkjd/twitch-miner:latest (and :sha-<commit>), so
# Unraid's Docker tab offers the update. A version tag (v0.3.0) also publishes :0.3.0.
# Tests run first; nothing is published if they fail.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv stopped publishing major tags (v8+): pin the release
        with:
          version: "0.11.28"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit && npm test
        working-directory: web

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_REF_NAME}@${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: DROPWATCH_COMMIT=${{ steps.meta.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/1Dkjd/Twitch-Miner
            org.opencontainers.image.description=Earns Twitch Drops and channel points for one account, with a web dashboard.
            org.opencontainers.image.licenses=MIT
          tags: |
            ghcr.io/1dkjd/twitch-miner:latest
            ghcr.io/1dkjd/twitch-miner:sha-${{ steps.meta.outputs.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/1dkjd/twitch-miner:{0}', steps.meta.outputs.version) || '' }}
