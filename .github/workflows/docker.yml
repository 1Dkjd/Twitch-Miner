# Publishes the image on a version tag (v0.2.0 -> ghcr.io/weltern/dropwatch:0.2.0 and :latest).
# Tests run first; nothing is published if they fail.
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit && npm test
        working-directory: web

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_REF_NAME}@${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: DROPWATCH_COMMIT=${{ steps.meta.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/weltern/dropwatch
            org.opencontainers.image.description=Earns Twitch Drops and channel points for one account, with a web dashboard.
            org.opencontainers.image.licenses=MIT
          tags: |
            ghcr.io/weltern/dropwatch:${{ steps.meta.outputs.version }}
            ghcr.io/weltern/dropwatch:latest
