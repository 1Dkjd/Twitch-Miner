<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dropwatch · Inventory</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0e10}
a{color:#bf94ff}a:hover{color:#d9c2ff}
.dw{--bg:#0e0e10;--s1:#18181b;--s2:#1f1f23;--s3:#2a2a30;--line:#2f2f35;--fg:#efeff1;--mut:#adadb8;--dim:#8a8a99;--live:#eb0400;--okt:#3ddc97;--warn:#ffb31a;--acct:#bf94ff;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg);min-height:100vh;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;gap:20px;padding:0 24px;min-height:60px;background:var(--s1);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;color:var(--fg);text-decoration:none}
.logo{width:30px;height:30px;border-radius:8px;background:var(--acc);display:flex;align-items:center;justify-content:center}
.tabs{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.tab{display:flex;align-items:center;height:60px;padding:0 14px;color:var(--mut);font-weight:600;text-decoration:none;box-sizing:border-box;border-bottom:2px solid transparent}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:rgba(61,220,151,.12);color:var(--okt);font-weight:700;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px}
.art{aspect-ratio:3/4;border-radius:6px;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:rgba(61,220,151,.12);color:var(--okt)}
.chip.warn{background:rgba(255,179,26,.13);color:var(--warn)}
.chip.acc{background:rgba(145,70,255,.18);color:var(--acct)}
.chip.mut{background:var(--s3);color:var(--mut)}
.filter{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);font:600 13px Inter,sans-serif;cursor:pointer}
.filter:hover{color:var(--fg);border-color:#45454d}
.filter.on{background:var(--fg);color:#0e0e10;border-color:var(--fg)}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.fill{height:100%;background:var(--acc);border-radius:3px}
.drop{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rw{width:44px;height:44px;border-radius:8px;background:var(--s3);display:flex;align-items:center;justify-content:center;color:var(--acct);flex-shrink:0}
.field{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:6px;background:var(--s2);border:1px solid var(--line);color:var(--mut)}
.field input{background:transparent;border:0;outline:0;color:var(--fg);font:500 14px Inter,sans-serif;flex:1;min-width:0}
</style>
</helmet>
<div class="dw" style="--acc: {{accent}}">
  <header class="top">
    <a class="brand" href="Main.dc.html"><span class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="M6 10l6 6 6-6"></path><path d="M5 21h14"></path></svg></span>Dropwatch</a>
    <nav class="tabs" aria-label="Views">
      <a class="tab" href="Main.dc.html">Overview</a>
      <a class="tab" href="Priorities.dc.html">Priorities</a>
      <a class="tab on" href="Inventory.dc.html" aria-current="page">Inventory</a>
      <a class="tab" href="History.dc.html">History</a>
      <a class="tab" href="#">Activity</a>
      <a class="tab" href="#">Settings</a>
    </nav>
    <span class="pill" role="status"><span class="dot" aria-hidden="true"></span>Mining</span>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 28px 24px 56px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap">
      <div style="flex: 1; min-width: 260px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em">Inventory</h1>
        <p class="mut" style="margin: 6px 0 0">Every campaign on your account, with each drop's progress.</p>
      </div>
      <label class="field" style="width: 280px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search campaigns</span><input type="search" placeholder="Search game or campaign"></label>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap" role="group" aria-label="Filter">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button type="button" class="filter {{f.cls}}" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}} <span class="num" style="opacity: .7">{{f.n}}</span></button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 18px">
      <sc-for list="{{camps}}" as="c" hint-placeholder-count="4">
        <article class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; gap: 14px; align-items: flex-start; padding-bottom: 12px">
            <div class="art" style="width: 52px; background: {{c.color}}" aria-hidden="true"></div>
            <div style="flex: 1; min-width: 0">
              <div class="mut" style="font-size: 12px; font-weight: 600">{{c.game}}</div>
              <h2 style="margin: 2px 0 0; font-size: 16px; font-weight: 700">{{c.name}}</h2>
              <div class="mut num" style="font-size: 12px; margin-top: 2px">{{c.ends}}</div>
            </div>
            <span class="chip {{c.tone}}">{{c.state}}</span>
          </div>
          <sc-for list="{{c.drops}}" as="d" hint-placeholder-count="2">
            <div class="drop">
              <div class="rw"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"></rect><path d="M12 8v13"></path><path d="M3 12h18"></path><path d="M7.5 8a2.5 2.5 0 1 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 1 1 0 5"></path></svg></div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
                <div style="display: flex; gap: 8px; align-items: baseline">
                  <span style="font-weight: 600; font-size: 13px; flex: 1">{{d.reward}}</span>
                  <span class="mut num" style="font-size: 12px">{{d.prog}}</span>
                </div>
                <div class="bar"><div class="fill" style="width: {{d.pct}}; background: {{d.barColor}}"></div></div>
              </div>
            </div>
          </sc-for>
        </article>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9146ff","options":["#9146ff","#772ce8","#00c8af","#ff6905"]},"$preview":{"width":1440,"height":1320}}'>
class Component extends DCLogic {
  renderVals() {
    const acc = this.props.accent ?? '#9146ff';
    const pick = (this.state && this.state.filter) || 'all';
    const done = '#3ddc97';
    const all = [
      { game: 'Battlefield REDSEC', name: 'Open Series Cup #3', ends: 'Ends Sun 2 Nov, 11:59 PM', state: 'Mining', tone: 'acc', kind: 'progress', color: '#1d3a52', drops: [
        { reward: 'Dog Tag: Iron Wolf', prog: 'Claimed', pct: '100%', barColor: done },
        { reward: 'Cold Blooded', prog: '4 h 12 / 6 h', pct: '70%', barColor: acc },
        { reward: 'Weapon Charm: Ember', prog: '0 / 8 h', pct: '0%', barColor: acc } ] },
      { game: 'Overwatch 2', name: 'OWCS Stage 3 Playoffs', ends: 'Ends Mon 3 Nov', state: '1 left', tone: 'mut', kind: 'progress', color: '#7a3d12', drops: [
        { reward: 'Esports Loot Box', prog: 'Claimed', pct: '100%', barColor: done },
        { reward: 'Esports Loot Box', prog: 'Claimed', pct: '100%', barColor: done },
        { reward: 'Esports Loot Box', prog: '15 min / 1 h', pct: '25%', barColor: acc } ] },
      { game: 'Eternal Return', name: 'ERCC S12 Semi Day 1', ends: 'Ends Sat 1 Nov', state: 'Link account', tone: 'warn', kind: 'link', color: '#2c2f6b', drops: [
        { reward: 'Nadine Skin', prog: '0 / 2 h', pct: '0%', barColor: acc },
        { reward: 'A-Coin x300', prog: '0 / 4 h', pct: '0%', barColor: acc } ] },
      { game: 'Apex Legends', name: 'ALGS S2 PO D3', ends: 'Ended today', state: 'Done', tone: 'ok', kind: 'claimed', color: '#6e1a1a', drops: [
        { reward: 'APEX Pack', prog: 'Claimed 2:25 PM', pct: '100%', barColor: done } ] },
      { game: 'Grand Theft Auto V', name: 'nopixel V', ends: 'Ends Fri 7 Nov', state: '1 left', tone: 'mut', kind: 'progress', color: '#1f4d2b', drops: [
        { reward: 'Grotti Turismo Omaggio', prog: 'Claimed', pct: '100%', barColor: done },
        { reward: 'Pegassi Tempesta', prog: '0 / 4 h', pct: '0%', barColor: acc } ] },
      { game: 'The Other Side', name: 'Halloween 2026', ends: 'Ends Sat 1 Nov', state: 'Link account', tone: 'warn', kind: 'link', color: '#3b2a52', drops: [
        { reward: 'Pumpkin Lantern', prog: '0 / 1 h', pct: '0%', barColor: acc } ] }
    ];
    const defs = [['all', 'All'], ['progress', 'In progress'], ['link', 'Needs link'], ['claimed', 'Done']];
    return {
      accent: acc,
      filters: defs.map(([id, label]) => ({
        label, n: id === 'all' ? all.length : all.filter((c) => c.kind === id).length,
        on: pick === id ? 'true' : 'false', cls: pick === id ? 'on' : '',
        pick: () => this.setState({ filter: id })
      })),
      camps: pick === 'all' ? all : all.filter((c) => c.kind === pick)
    };
  }
}
</script>
</body>
</html>
