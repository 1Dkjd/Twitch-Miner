[project]
name = "dropsminer"
version = "0.1.0"
description = "Headless Twitch drops miner (private)"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10",
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# the phase-1 browser sign-in, kept as a PC-only fallback (`dropsminer signin --browser`); Docker skips it
browser = ["zendriver==0.17.0"]

[project.scripts]
dropsminer = "dropsminer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27", "zendriver==0.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dropsminer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
# capture.py is a dev tool that writes fixture files synchronously by design
per-file-ignores = { "src/dropsminer/twitch/capture.py" = ["ASYNC240"] }
